<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LazyChef</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1c1c1c; --muted: #6b6b6b; --brand: #2f7d4f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f2f2f2; --muted: #a3a3a3; } }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center; text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      main { max-width: 320px; display: grid; gap: 12px; justify-items: center; }
      .icon { width: 64px; height: 64px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 32px; }
      h1 { font-size: 22px; margin: 8px 0 0; }
      p { color: var(--muted); margin: 0; }
      button { margin-top: 12px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🍳</div>
      <h1>You're offline</h1>
      <p>LazyChef needs a connection to load your pantry. Check your Wi-Fi or data, then try again.</p>
      <button type="button" onclick="location.replace('https://lazychef-gamma.vercel.app/pantry')">Try again</button>
    </main>
  </body>
</html>
