<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline · LazyChef</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fbf8f1;
        --foreground: #2b231c;
        --muted: #7a6e62;
        --primary: #2f7d4f;
        --primary-foreground: #fdfbf5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1a1714;
          --foreground: #f3efe6;
          --muted: #b3a999;
          --primary: #6cc48c;
          --primary-foreground: #14261b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 { margin: 8px 0 0; font-size: 24px; font-weight: 600; }
      p { margin: 0; max-width: 300px; color: var(--muted); line-height: 1.45; }
      button {
        margin-top: 12px;
        min-width: 160px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
        font-size: 17px;
      }
      button:active { opacity: 0.8; }
      svg { color: var(--muted); }
    </style>
  </head>
  <body>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
      <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" /><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
      <path d="M5 13a10 10 0 0 1 5.24-2.76" /><path d="m2 2 20 20" />
    </svg>
    <h1>You're offline</h1>
    <p>LazyChef needs a connection to load your pantry and list. Check your signal and try again.</p>
    <button type="button" id="retry">Try again</button>
    <script>
      // Same URL as server.url in capacitor.config.ts.
      var APP_URL = "https://lazychef-gamma.vercel.app/"
      var button = document.getElementById("retry")
      function retry() {
        button.textContent = "Connecting…"
        window.location.replace(APP_URL)
      }
      button.addEventListener("click", retry)
      // Come back by itself once the phone reconnects.
      window.addEventListener("online", retry)
    </script>
  </body>
</html>
