# Weekly dependency updates as PRs. Minor and patch bumps come grouped so there's one PR to
# review, not twenty. Security fixes open right away regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Major versions (Next, React, TypeScript, ESLint...) change APIs and config; upgrade those
    # on purpose, in their own branch, not from a weekly bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
