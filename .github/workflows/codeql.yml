name: CodeQL

# GitHub's code scanning for security bugs (XSS, injection, open redirects, leaked secrets in
# code). Free for public repos. Findings show up under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # Mondays, catches new rules even without new commits

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
